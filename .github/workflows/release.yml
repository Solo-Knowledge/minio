name: Release and Publish Docker Image

on:
  push:
    tags:
      - 'RELEASE.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (leave empty for auto-generated timestamp tag)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="RELEASE.$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit_id=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.release_tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_TAG=${{ steps.vars.outputs.release_tag }}
            COMMIT_ID=${{ steps.vars.outputs.commit_id }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.release_tag }}"
          REPO="${{ github.repository }}"
          printf "# MinIO Community Release %s\n\n### Docker Image\n\`\`\`bash\ndocker pull ghcr.io/%s:latest\ndocker pull ghcr.io/%s:%s\n\`\`\`\n" "$TAG" "$REPO" "$REPO" "$TAG" > release_notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file release_notes.md
          fi
